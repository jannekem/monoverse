[package]
name = "monoverse"
version = "0.1.7"
edition = "2021"
authors = ["Janne Kemppainen"]
description = "A CLI tool for managing version numbers in monorepos."
license = "Apache-2.0"
repository = "https://github.com/jannekem/monoverse"
readme = "README.md"
keywords = ["version", "monorepo", "cli"]
categories = ["development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
config = "0.15.19"
git2 = "0.20.3"
libyaml-safer = "0.3.0"
log = "0.4.29"
regex = "1.12.2"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_yaml = "0.9.30"
stderrlog = { version = "0.6.0", default-features = false }
thiserror = "2.0.17"
toml_edit = "0.24.0"
