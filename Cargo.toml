[package]
name = "monoverse"
version = "0.1.9"
edition = "2021"
authors = ["Janne Kemppainen"]
description = "A CLI tool for managing version numbers in monorepos."
license = "Apache-2.0"
repository = "https://github.com/jannekem/monoverse"
readme = "README.md"
keywords = ["version", "monorepo", "cli"]
categories = ["development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
config = "0.15.27"
git2 = "0.21.0"
libyaml-safer = "0.3.0"
log = "0.4.35"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stderrlog = { version = "0.6.0", default-features = false }
toml_edit = "0.25.21"
